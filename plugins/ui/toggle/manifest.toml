# sigflow.ui.toggle — bool 参数开关（MVP 8 控件之一）。默认渲染成左右拨动
# 开关（style=switch）；style=checkbox 回退勾选框。纯 manifest 包。
name = "sigflow.ui.toggle"
version = "0.1.0"
category = "ui_widget"

[runtime]
type = "native"
library = "widget.json"
entry = "unused"

[widget]
widget_type = "toggle"
bindable_to = [{ kind = "param", data_type = "bool" }]

# switch = 左右拨动开关（默认）；checkbox = 勾选框。
[widget.config_schema.style]
type = "enum"
default = "switch"
enum_values = ["switch", "checkbox"]

[widget.config_schema.label]
type = "string"

# switch 样式旁的状态字（缺省 ON/OFF）。
[widget.config_schema.on_text]
type = "string"

[widget.config_schema.off_text]
type = "string"
