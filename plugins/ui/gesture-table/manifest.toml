# sigflow.ui.gesture_table —— 手势表编辑器（表格 + 示教 + 播放）。
#
# 绑一个**字符串参数**（bind kind = "param"），里面装一份手势库。控件本身不
# 认识关节，也不认识 CiA402：一张表 = 若干步，一步 = 逐轴目标位置 + 逐轴工况
# + 一个驻留。这三样东西的**含义由下游那个消费 waypoint 的插件定义**，这里
# 只负责让人把它们编出来、看得懂、发得出去。
#
# ── 轴从哪来：不从这里设 ────────────────────────────────────────────────
# 控件不提供"轴数量"这个设置。它顺着本节点 `targets` 口的那条连线找到下游
# 节点，读它挂的轴文档，一次拿到四样东西：
#
#   轴名          页面上每一行的名字（拇指/食指，不是 s0/s1）
#   工况名列表    每根轴各一份 —— 工况那一格是下拉，不是数字
#   减速比        示教换算要用（见下）
#   每转计数      位置格上的度数旁注
#
# 理由是执行器的 `slaves` 参数本来就带 `visible_when config_path == ""`：挂了
# 文档之后轴数就归文档管。编辑器再设一遍就是第二个说法，而两个说法分家的
# 表现是**位置落到别的轴上**——和拆走从站导致电机对错轴同一类事故，只是这次
# 错在文件里，没有任何硬件现象会提示。
#
# 表里存了一份建表时的轴名快照，专门用来发现这种错位；对不上时控件直说，
# 并提供"按名字对齐"。
#
# ── 驻留是**步**的属性 ──────────────────────────────────────────────────
# 执行器推进队列的条件是「全部关节都到位」+ 一个驻留倒计时，一个 waypoint
# 只有一个驻留值，线上格式里也只有一列放它。所以表里驻留横跨整列一行，不是
# 每根轴一格 —— 逐轴各写一个停留时间在这套执行语义里没有落点。
#
# 而且「到位」= **指令**到位（插值器走到了目标），不看编码器。手指被物体挡住
# 时指令照样到位、驻留照常开始倒计时。这不是缺陷（反过来做的话堵转会把整条
# 队列永久卡死），但它决定了驻留该怎么解释，控件把这句话挂在表头上。
#
# ── 工况 0 = 不改 ───────────────────────────────────────────────────────
# 序号 1 起数，0 = 沿用上一步的工况。控件把这一格渲染成下拉（`不改` + 各工况
# 名），不显示数字 —— 显示成 0，操作者迟早会以为那是"第 0 组"。
#
# ── 示教：位置不是能手打出来的数 ────────────────────────────────────────
# 位置是**输出轴 counts、相对本轮首次使能锁存的基准**。没人能手打出这个数，
# 所以每一步都有一个「示教」键：把各轴当前位置抓进这一步。
#
# **换算陷阱（会伤人）**：遥测 `position` 口的 `pos` 列是**电机侧** counts
# （`apos − base`），而 waypoint 的位置是**输出轴** counts（执行器算
# `wp_base + 值 × 减速比` 才回到电机侧）。所以抓进来要**除以减速比**——
# 72:1 的轴上直接抄，发下去就是 72 倍，手指一步怼到止挡上。换算做在
# `gesture.ts` 的 `captureStep` 里，只此一处。
#
# ── 保存 = 可能立刻动 ───────────────────────────────────────────────────
# 手势参数是 hot_change，播放器的 autoplay 一开，写回去就是重播。所以控件
# **不做即时写入**：改动攒成草稿，保存是一次明确的动作，按钮上直说会不会当场
# 重播。边编辑边抖在真机上是危险的。
#
# ── 停止是两下，没有暂停 ────────────────────────────────────────────────
# 「停止」按钮做两件事，缺一不可：
#
#   ① 播放器的 `stop`           —— 撤掉待播、按住周期重播
#   ② 执行器的 `clear_waypoints` —— 清队列 + 按 amax 就地刹停
#
# 只做 ②：`repeat_s > 0` 或 autoplay 会在几秒后把队列重新灌满，现象是「停不
# 下来」，而且看不出是谁在灌。只做 ①：已经发出去的 waypoint 还在执行器的 RT
# 环里，手会继续走完。
#
# ② 是**直接调下游节点**，不让播放器代理。队列在执行器的 RT 环里，代理就要求
# 播放器知道自己的下游是谁——那是图的知识不是插件的；而且它清不动已经发出去
# 的东西，代理只会造一个"停了"的假象。
#
# 这套模型里**没有暂停**：队列一清就没有恢复点了，装一个暂停按钮等于承诺一件
# 不存在的事。真正的暂停/续播要等播放器拿到执行器的进度反馈（`diag` 口的
# wp_pending / wp_done）——到那时暂停 = 清队列 + 记住第几步，恢复 = 从那一步
# play_from。另一轮的事。
#
# ── 手势库的线上格式 ────────────────────────────────────────────────────
# 参数里装的 JSON：
#
#   {"version": 1,
#    "active": "抓握",                     ← 默认播哪张（表名）
#    "tables": [
#      {"name": "抓握",
#       "axes": ["拇指","食指"],           ← 建表时的轴名快照，用于对账
#       "steps": [
#         {"name":"预备", "dwell":0.5,     ← 驻留：步属性，一步一个
#          "pos":[0,0],                    ← 逐轴位置（输出轴 counts）
#          "profile":[0,1]}                ← 逐轴工况序号（0=不改，1 起数）
#       ]}]}
#
# 老写法照收并升级成一张表：`[[…],…]` 和 `{"waypoints":[[…],…]}`。其中
# 「一个序号管全轴」那种（n+2 列）会**按名字**摊成逐轴序号——这正是主站在做
# 的事，只是摊开之后它在表上看得见了；摊不动的轴落"不改"并当场说出来。
#
# 播放器侧读这份库要认的参数（留空/缺失都有明确回落，见控件里的提示条）：
#   active_table  播哪张（空 = 跟库里的 active）——与「集合的活动项」同一套
#                 声明方式：参数说了算，参数留空才交还给文档。**点名了却找
#                 不到 = 不播**，不回落到第一张：手势是位置指令，播错一张就
#                 是手指往没人预期的地方去。控件会认出这个会安静卡住的状态
#                 （按播放没反应而表看起来正常）并说出来。
#   play_from     从第几步（1 起数，0 = 从头）
#   play_to       到第几步（0 = 到尾）
#   play_mode     once / loop
#
# 选段**起 > 止不替人对调**，两边都是整段拒收——"我是不是填反了"只能由填的
# 人回答，自动对调会让一个填错的选段安安静静播成另一段。
#
# 选段的列宽按**整段**定（一帧里各行必须等宽）：选段里但凡有一个非零工况，
# 整段就发 2n+1 的宽行。逐行决定会编出宽窄不一的帧，整帧被拒收。
#
# 纯 manifest 包：壳体只读声明做绑定校验，前端负责渲染；[runtime] 是 schema
# 必填项，widget.json 只是占位内容，永远不会被加载。
name = "sigflow.ui.gesture_table"
version = "0.1.0"
category = "ui_widget"

[runtime]
type = "native"
library = "widget.json"
entry = "unused"

[widget]
widget_type = "gesture_table"
# presentation = "page"：8 轴 × 几十步的表缩不进画布上的节点脸，宿主按整页
# 渲染，节点脸上只留入口。
presentation = "page"
bindable_to = [{ kind = "param", data_type = "string" }]

[widget.config_schema.label]
type = "string"

# 打开时步放在列上还是行上。列 = 与手写脚本的读法一致，一眼看得出一根轴走了
# 什么轨迹；行 = 步数远多于轴数时好翻（纵向滚是免费的，横向不是）。
# 两种视图随时可切，这里只是默认值。
[widget.config_schema.orientation]
type = "enum"
enum_values = ["steps_as_columns", "steps_as_rows"]
default = "steps_as_columns"
