# sigflow.ui.gesture_table —— 手势表编辑器（表格 + 示教 + 播放）。
#
# 绑一个**字符串参数**（bind kind = "param"），里面装一份手势库。控件本身不
# 认识关节，也不认识 CiA402：一张表 = 若干步，一步 = 逐轴目标位置 + 逐轴工况
# + 逐轴力上限 + 一个驻留。这几样东西的**含义由下游那个消费 waypoint 的插件
# 定义**，这里只负责让人把它们编出来、看得懂、发得出去。
#
# ── 轴从哪来：不从这里设 ────────────────────────────────────────────────
# 控件不提供"轴数量"这个设置。它顺着本节点发走点的那条连线找到下游节点，读
# 它挂的轴文档，一次拿到四样东西。**认口按语义类型**（`control.waypoints`）
# 不按口名——口叫什么是插件的事，语义类型才是契约；认不出来才退回习惯名
# `targets`，而且提示条里说的是它真实找的那个名字。
#
#   轴名          页面上每一行的名字（拇指/食指，不是 s0/s1）
#   工况名列表    每根轴各一份 —— 工况那一格是下拉，不是数字
#   减速比        示教换算要用（见下）
#   每转计数      位置格上的度数旁注
#   额定电流      力上限那一格的换算基准（见下）
#
# 理由是执行器的 `slaves` 参数本来就带 `visible_when config_path == ""`：挂了
# 文档之后轴数就归文档管。编辑器再设一遍就是第二个说法，而两个说法分家的
# 表现是**位置落到别的轴上**——和拆走从站导致电机对错轴同一类事故，只是这次
# 错在文件里，没有任何硬件现象会提示。
#
# 表里存了一份建表时的轴名快照，专门用来发现这种错位；对不上时控件直说，
# 并提供"按名字对齐"。
#
# ── 驻留是**步**的属性 ──────────────────────────────────────────────────
# 执行器推进队列的条件是「全部关节都到位」+ 一个驻留倒计时，一个 waypoint
# 只有一个驻留值，线上格式里也只有一列放它。所以表里驻留横跨整列一行，不是
# 每根轴一格 —— 逐轴各写一个停留时间在这套执行语义里没有落点。
#
# 而且「到位」= **指令**到位（插值器走到了目标），不看编码器。手指被物体挡住
# 时指令照样到位、驻留照常开始倒计时。这不是缺陷（反过来做的话堵转会把整条
# 队列永久卡死），但它决定了驻留该怎么解释，控件把这句话挂在表头上。
#
# ── 同一张表上有两种 0，含义相反 ────────────────────────────────────────
# **工况那一列的 0 = 不改**（沿用上一步）。工况是*选择*，没有"关掉工况"这个
# 值，所以 0 只能表示"不动它"。序号 1 起数；控件把这一格渲染成下拉
# （`不改` + 各工况名），不显示数字 —— 显示成 0，操作者迟早会以为那是"第 0 组"。
#
# **力上限那一列的 0 = 不限制**。力上限是*界*，"无界"是它真实存在的一个取值。
# 所以这一格是**数字输入**（连续量，不是选择），而 0 显示成占位符「不限」而不
# 是一个数字 0 —— 显示成 0，操作者迟早会读成"限到 0"，而 0x6072 写 0 是完全无
# 力矩、可被重力反驱，正好是反的。
#
# 但凡把一边的规矩套到另一边，错的方向一律是**往松了猜**：
#
#              工况序号                力上限（mA）
#   0 的意思    不改（沿用上一步）      不限制
#   负数        静默收成 0（= 不改）    **整张库拒收**
#   缺列        按 0 补 = 不改          按 0 补 = 不限制
#   越界        主站拦下 / 静默拒绝     ≥ 额定电流 = 悄悄地什么都不限
#
# ── 力上限：三条界一起取其小 ────────────────────────────────────────────
# 手势里这一列不是唯一的一条界，一共三条，**取其小、没有优先级**（任何一处
# 调小都立刻有效，不用记谁赢）：
#
#   ① 执行器的 `grip_force_ma`  全轴同一个值，配 sigflow.ui.slider 那个旋钮
#   ② 执行器的 `manual_force`    逐轴字符串，细调
#   ③ 手势里这一列              随手势走，只在 waypoint 源下算数
#
# 0 = 不限制、不参与取小 —— **①除外**：它是拖出来的，滑块最左端读成"满力"是
# 能想到的最坏的一种意外（想减力的人往左拖，拖到底手劲最大），所以它左弱右强、
# 单调、没有特殊值，"不限制"在最右端。要是编辑器里以后也摆个力的滑块，同一条
# 理由适用。
#
# **额定电流是换算基准，不是界**：执行器写 0x6072 时算 `mA × 1000 ÷ 额定` 再
# 箝到 1..1000‰。两个后果控件都得说出来 ——
#   `mA ≥ 额定`  → 满值 = 不限制。**填了一个看着像界的数，其实没有界**（黄框）。
#   读不到额定  → 执行器同样写满值，**这一列一格也限不住**（横幅点名那几根轴）。
# 后者在没挂轴文档时是常态。与"软限位敞开成 ±1e9"同一类：不是没问题，是这条
# 界此刻不存在。
#
# 小数会被执行器**截尾**（120.9 → 120，界往严取，不四舍五入）。
#
# ── 负的力上限：一处笔误，整份库都播不了 ────────────────────────────────
# 播放器是**一次读整个 gesture_json** 的，任何一处抛出就 `lib_tables = []`。
# 所以另一张表上的一个 `-50` 会让**眼前这张干干净净的表也播不了**，现象是按
# 播放没反应、屏幕上一处红都没有，唯一的痕迹是 stderr 里一行日志。
#
# 这句话只有编辑器说得出来：播放器手上是整份库但它只往 stderr 写一行，逐格
# 校验说得清是哪一格但它一次只看一张表。库在控件这一头，所以话在这一头 ——
# 横幅跨整份库点名（哪张表、第几步），播放键直接禁掉。
#
# ── 示教：位置不是能手打出来的数 ────────────────────────────────────────
# 位置是**输出轴 counts、相对本轮首次使能锁存的基准**。没人能手打出这个数，
# 所以每一步都有一个「示教」键：把各轴当前位置抓进这一步。
#
# **换算陷阱（会伤人）**：遥测 `position` 口的 `pos` 列是**电机侧** counts
# （`apos − base`），而 waypoint 的位置是**输出轴** counts（执行器算
# `wp_base + 值 × 减速比` 才回到电机侧）。所以抓进来要**除以减速比**——
# 72:1 的轴上直接抄，发下去就是 72 倍，手指一步怼到止挡上。换算做在
# `gesture.ts` 的 `captureStep` 里，只此一处。
#
# ── 保存 = 可能立刻动 ───────────────────────────────────────────────────
# 手势参数是 hot_change，播放器的 autoplay 一开，写回去就是重播。所以控件
# **不做即时写入**：改动攒成草稿，保存是一次明确的动作，按钮上直说会不会当场
# 重播。边编辑边抖在真机上是危险的。
#
# ── 停止是两下，没有暂停 ────────────────────────────────────────────────
# 「停止」按钮做两件事，缺一不可：
#
#   ① 播放器的 `stop`           —— 撤掉待播、按住周期重播
#   ② 执行器的 `clear_waypoints` —— 清队列 + 按 amax 就地刹停
#
# 只做 ②：`repeat_s > 0` 或 autoplay 会在几秒后把队列重新灌满，现象是「停不
# 下来」，而且看不出是谁在灌。只做 ①：已经发出去的 waypoint 还在执行器的 RT
# 环里，手会继续走完。
#
# ② 是**直接调下游节点**，不让播放器代理。队列在执行器的 RT 环里，代理就要求
# 播放器知道自己的下游是谁——那是图的知识不是插件的；而且它清不动已经发出去
# 的东西，代理只会造一个"停了"的假象。
#
# 这套模型里**没有暂停**：队列一清就没有恢复点了，装一个暂停按钮等于承诺一件
# 不存在的事。真正的暂停/续播要等播放器拿到执行器的进度反馈（`diag` 口的
# wp_pending / wp_done）——到那时暂停 = 清队列 + 记住第几步，恢复 = 从那一步
# play_from。另一轮的事。
#
# ── 手势库的线上格式 ────────────────────────────────────────────────────
# 参数里装的 JSON：
#
#   {"version": 1,
#    "active": "抓握",                     ← 默认播哪张（表名）
#    "tables": [
#      {"name": "抓握",
#       "axes": ["拇指","食指"],           ← 建表时的轴名快照，用于对账
#       "steps": [
#         {"name":"预备", "dwell":0.5,     ← 驻留：步属性，一步一个
#          "pos":[0,0],                    ← 逐轴位置（输出轴 counts）
#          "profile":[0,1],                ← 逐轴工况序号（0=不改，1 起数）
#          "force":[0,50]}                 ← 逐轴力上限 mA（0=不限制）
#       ]}]}
#
# `force` 缺字段 = 全 0 = 不限制，与加这一列之前的行为一模一样。
#
# 老写法照收并升级成一张表：`[[…],…]` 和 `{"waypoints":[[…],…]}`。其中
# 「一个序号管全轴」那种（n+2 列）会**按名字**摊成逐轴序号——这正是主站在做
# 的事，只是摊开之后它在表上看得见了；摊不动的轴落"不改"并当场说出来。
#
# ── 线上列宽即语义（cia402-csx `parse_targets`）──────────────────────────
#   n       纯位置
#   n+1     + 驻留
#   n+2     + 一个工况序号管全轴（按名字传播）
#   2n+1    + 逐轴各一个工况序号（按下标），仅 n>1 时成立
#   3n+1    + 逐轴力上限（mA）
# 列序 `[pos₀…, dwell, ord₀…, ma₀…]` —— 驻留在中间、工况在后、力再在后。
#
# **力那一段挂在工况段后面，不单独成一种宽度**：只加力不加工况会编出 2n+1，
# 而那正是逐轴工况的宽度 —— 两边都是合法输入，撞了下游只能靠猜。所以有力就
# 一定带上工况段，没填工况就补一段全 0（= 不改）。
#
# 播放器侧读这份库要认的参数（留空/缺失都有明确回落，见控件里的提示条）：
#   active_table  播哪张（空 = 跟库里的 active）——与「集合的活动项」同一套
#                 声明方式：参数说了算，参数留空才交还给文档。**点名了却找
#                 不到 = 不播**，不回落到第一张：手势是位置指令，播错一张就
#                 是手指往没人预期的地方去。控件会认出这个会安静卡住的状态
#                 （按播放没反应而表看起来正常）并说出来。
#   play_from     从第几步（1 起数，0 = 从头）
#   play_to       到第几步（0 = 到尾）
#   play_mode     once / loop
#
# 选段**起 > 止不替人对调**，两边都是整段拒收——"我是不是填反了"只能由填的
# 人回答，自动对调会让一个填错的选段安安静静播成另一段。
#
# 选段的列宽按**整段**定（一帧里各行必须等宽）：选段里但凡有一个非零工况，
# 整段就发 2n+1 的宽行；但凡有一个非零力上限，整段就发 3n+1。逐行决定会编出
# 宽窄不一的帧，整帧被拒收。
#
# 纯 manifest 包：壳体只读声明做绑定校验，前端负责渲染；[runtime] 是 schema
# 必填项，widget.json 只是占位内容，永远不会被加载。
name = "sigflow.ui.gesture_table"
version = "0.1.0"
category = "ui_widget"

[runtime]
type = "native"
library = "widget.json"
entry = "unused"

[widget]
widget_type = "gesture_table"
# presentation = "page"：8 轴 × 几十步的表缩不进画布上的节点脸，宿主按整页
# 渲染，节点脸上只留入口。
presentation = "page"
bindable_to = [{ kind = "param", data_type = "string" }]

[widget.config_schema.label]
type = "string"

# 打开时步放在列上还是行上。列 = 与手写脚本的读法一致，一眼看得出一根轴走了
# 什么轨迹；行 = 步数远多于轴数时好翻（纵向滚是免费的，横向不是）。
# 两种视图随时可切，这里只是默认值。
[widget.config_schema.orientation]
type = "enum"
enum_values = ["steps_as_columns", "steps_as_rows"]
default = "steps_as_columns"
