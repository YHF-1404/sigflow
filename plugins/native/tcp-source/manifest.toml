name = "sigflow.io.tcp_source"
version = "0.1.0"
category = "compute"

[runtime]
type = "native"
library = "libsigflow_plugin_tcp_source.dylib"
entry = "sigflow_plugin_create"

# Raw byte stream from a TCP server. Deliberately format-agnostic: it emits
# whatever bytes arrive (Opaque payload), tagged with host arrival time. A
# downstream parser reassembles application records. The byte axis is treated
# as an i8 sample stream so sample_index is a monotonic byte counter and drops
# (if any) surface as a sample_index jump. (i8, not u8: `Dtype` has no unsigned
# name and i8 is the only 1-byte dtype; per the connect rule a consumer of this
# port must declare i8 as well — see docs/scope-contract.md §1.)
[[ports]]
id = "bytes"
direction = "producer"
semantic_type = { kind = "net.tcp_bytes", dtype = "i8", clock_domain = "host_monotonic" }

[[parameters]]
id = "host"
param_type = "string"
default = { string = "127.0.0.1" }
hot_change = false
label = "Server host"

[[parameters]]
id = "port"
param_type = "u32"
range = { u32_range = { min = 1, max = 65535 } }
default = { u32 = 9000 }
hot_change = false
label = "Server port"
