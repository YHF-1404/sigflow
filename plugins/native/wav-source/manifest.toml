# sigflow.io.wav_source —— 把一个 stereo WAV 文件播成一个两列的口（`l` / `r`）。
#
# 为什么存在：示波器音乐（oscilloscope music）——两路音频驱动示波器的 X-Y，屏上
# 是画不是波形。example/oscilloscope-music.sh 用它放 Revision 2025 的 Wild 冠军
# Primer。也可以拿它给示波器喂任何真实录音。
#
# **不声明 declared_rate_hz**：文件的采样率是运行期才知道的（取决于用户给哪个
# 文件），而声明的率必须是编译期常量。所以每一帧带 `sfrate01` 注解说实际率
# ——同 sig-gen。
#
# **不声明率 ≠ 没有率**：第一帧的注解一到，口就有率了，示波器四种时钟
# （native / auto / fixed）都建得起来（sigflow-core 在 sig-gen 上四种都实测过）。
# 代价只是**率是第一帧才知道的观测**：节点起来、还没开始播的时候，常驻示波器会
# 停在"在等口出第一帧"——那是对的行为，但看着像坏了，所以例子里要说一句。
#
# 例子选 `native`，理由是**原样进环、画的是真轨迹**（重采样会插值），不是"只能它"。
#
# **只收 stereo**：X-Y 要两路不同的信号，单声道画出来是一条对角线（x = y）。
# 别的声道数当场报错并说清怎么转。要放别的格式（FLAC / MP3）先转成 WAV：
#   ffmpeg -i primer.flac primer.wav
#
# 出帧节奏按墙钟（同 sig-gen）：每个 tick 只发到"此刻该存在"的样本数，
# sample_index / t0_ns 是真时间。整个 data 段读进内存后按帧解码（16/24/32 位
# 整数和 32 位浮点都认），所以内存 ≈ 文件大小。
#
# **第二个口 `transport`（20 Hz）是进度条的出口**：位置 / 时长 / 播放态 / 出声态。
# 插件没有别的路把"现在放到哪了"告诉 UI——原生插件的参数只能被写、不能自己改，
# 所以进度走数据面，一个 4 列的小口，帧上限 256 字节（共享内存按帧上限预留）。
# 暂停 / 放完时它照发：进度条要知道停在哪。
#
# 暂停 = `playing = false`（bool 参数，不是动作：态要能持久、能被开关控件绑）。
# 再播时重新锚定并带一次不连续标记——暂停期间墙钟走了、拍没出，采样轴真的断了。
# 跳转 = 写 `seek_s`（写入即跳，一个命令而不是状态；实时位置看 transport 口）。
# 跳转 / 循环回头 / 从头播都**不**带不连续标记：断的是内容，采样轴一拍没丢。
#
# 出声走系统默认输出设备（cpal：Linux ALSA / macOS CoreAudio / Windows WASAPI）。
# 声卡不当时钟：口的节奏还是墙钟，声音从一个环里跟着取；打不开设备只在
# transport 口的 audio 列上报（2 = 设备打不开），画面照常——画才是主产品。
# `volume` 与 `gain` 分开：gain 是画面的（削顶是画面的事），volume 只管耳朵。
name = "sigflow.io.wav_source"
version = "0.1.0"
category = "compute"

[runtime]
type = "native"
library = "libsigflow_plugin_wav_source.so"
entry = "sigflow_plugin_create"

# 两列：左右声道。X-Y 上一路当横轴、一路当纵轴。
# 单位写 "" 而不是 "V"：WAV 的样本是归一化到 ±1 的无量纲值，不是伏特——
# 标成 V 会让刻度和测量读数说一个不存在的物理量。
[[ports]]
id = "audio"
direction = "producer"
semantic_type = { kind = "timeseries.signal", dtype = "f32", clock_domain = "host_monotonic" }
max_frame_bytes = 262144

[[ports.columns]]
id = "l"
label = "左 / X"
kind = "signal"
bound = { min = -1.0, max = 1.0 }

[[ports.columns]]
id = "r"
label = "右 / Y"
kind = "signal"
bound = { min = -1.0, max = 1.0 }

# 进度条的出口：20 Hz 一拍，每拍 4 列。位置的界引用同帧的时长列——时长只有
# 生产方知道（是哪个文件的事），量表 / 进度条按契约就能画满条。
[[ports]]
id = "transport"
direction = "producer"
semantic_type = { kind = "timeseries.signal", dtype = "f32", clock_domain = "host_monotonic" }
declared_rate_hz = 20.0
max_frame_bytes = 256

[[ports.columns]]
id = "pos_s"
label = "位置"
unit = "s"
kind = "signal"
bound = { min = 0.0, max = { column = "dur_s" } }

[[ports.columns]]
id = "dur_s"
label = "时长"
unit = "s"
kind = "signal"

# 0 / 1 / 2 的次序是 sigflow.ui.transport 控件认的约定（它按值而不是按名字判）。
[[ports.columns]]
id = "state"
label = "播放态"
kind = "enum"
decode = [
  { value = 0, name = "暂停", tone = "neutral" },
  { value = 1, name = "播放", tone = "good" },
  { value = 2, name = "放完", tone = "off" },
]

[[ports.columns]]
id = "audio"
label = "出声"
kind = "enum"
decode = [
  { value = 0, name = "关", tone = "off" },
  { value = 1, name = "出声", tone = "good" },
  { value = 2, name = "设备打不开", tone = "warn" },
]

[[parameters]]
id = "path"
param_type = "string"
default = { string = "" }
hot_change = true
label = "WAV 文件路径（stereo；空 = 不出数）"

[[parameters]]
id = "loop_play"
param_type = "bool"
default = { bool = true }
hot_change = true
label = "放完从头再来"

# 暂停 / 继续。放完（不循环）之后再打开 = 从头播——按钮按下去得有动静。
[[parameters]]
id = "playing"
param_type = "bool"
default = { bool = true }
hot_change = true
label = "播放（关 = 暂停）"

# 写入即跳到这个时刻。这是命令不是状态：回读到的是上次写的值，不是现在放到哪
# ——实时位置在 transport 口的 pos_s 列。上限 86400 只是让范围有个数（文件时长
# 是运行期才知道的），越过文件尾按尾算。
[[parameters]]
id = "seek_s"
param_type = "f64"
range = { f64_range = { min = 0.0, max = 86400.0 } }
default = { f64 = 0.0 }
hot_change = true
unit = "s"
label = "跳到第几秒（写入即跳；实时位置看 transport 口）"

[[parameters]]
id = "gain"
param_type = "f64"
range = { f64_range = { min = 0.0, max = 8.0 } }
default = { f64 = 1.0 }
hot_change = true
label = "增益（画太小就往上拧；超过 1 会削顶）"

[[parameters]]
id = "speed"
param_type = "f64"
range = { f64_range = { min = 0.05, max = 4.0 } }
default = { f64 = 1.0 }
hot_change = true
label = "播放速度（× 文件采样率；慢放看轨迹细节）"

# 出声：系统默认输出设备。打不开只在 transport 口的 audio 列报，画面照常。
[[parameters]]
id = "audio"
param_type = "bool"
default = { bool = true }
hot_change = true
label = "出声（系统默认输出设备）"

[[parameters]]
id = "volume"
param_type = "f64"
range = { f64_range = { min = 0.0, max = 1.0 } }
default = { f64 = 0.8 }
hot_change = true
label = "音量（只管声音，不动画面）"

[[actions]]
id = "restart"
label = "从头播"
