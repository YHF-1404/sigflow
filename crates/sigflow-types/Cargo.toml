[package]
name = "sigflow-types"
version = "0.1.0"
edition = "2021"

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
toml = "0.8"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10", optional = true, features = ["serde-compat", "serde-json-impl"] }

# clock_gettime for the shared monotonic clock — Windows uses QPC via a
# direct kernel32 extern instead.
[target.'cfg(not(windows))'.dependencies]
libc = "0.2"
