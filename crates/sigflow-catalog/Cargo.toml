[package]
name = "sigflow-catalog"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
blake3 = "1"
humantime = "2"
rusqlite = { version = "0.37", features = ["bundled"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# SQLite index + query (the rebuildable `_index/` cache). Off by default so
# the storage sink never links SQLite — only the CLI/analysis side does.
index = ["dep:rusqlite"]
