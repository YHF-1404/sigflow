name = "__PLUGIN_ID__"
version = "0.1.0"
category = "compute"

[runtime]
type = "process"
command = "__PLUGIN_NAME__"   # pkg/ 内的二进制名，壳体相对安装目录解析
script = ""

[[ports]]
id = "out"
direction = "producer"
semantic_type = { kind = "any" }

[[parameters]]
id = "batch_size"
param_type = "u32"
range = { u32_range = { min = 1, max = 1024 } }
default = { u32 = 8 }
unit = "samples"
label = "Batch size"
